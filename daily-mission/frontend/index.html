<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BioNEET — Your ultimate NEET & EAPCET BiPC preparation platform with AI-powered study plans, mock tests, rank predictors, and more." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preload critical fonts for faster text rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

    <title>Daily Mission — NEET & EAPCET BiPC Prep</title>

    <!-- Inline critical CSS to prevent FOUC -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      body { background: #0a0a0f; color: #e2e8f0; min-height: 100dvh; overflow-x: hidden; }
      #root { min-height: 100dvh; }
      /* Initial loading spinner before JS loads */
      #root:empty::after {
        content: '';
        display: block;
        width: 32px; height: 32px;
        margin: 45vh auto;
        border: 2px solid rgba(99,102,241,0.3);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: sp .6s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
