services:
  - type: web
    name: daily-mission-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daily-mission-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: psql
    name: daily-mission-db
    plan: free
